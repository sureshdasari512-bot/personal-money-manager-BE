
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pmt-backend
    ports:
      - "3001:4000"
    env_file:
      - .env
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pmt-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
