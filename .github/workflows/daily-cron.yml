name: Daily Due Reminders — 8 AM IST (triggers at 7:59)

on:
  schedule:
    - cron: '29 2 * * *'   # 02:29 UTC = 07:59 IST (30s buffer before 8 AM)
  workflow_dispatch:         # manual trigger for testing

jobs:
  trigger-due-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render — POST /internal/due-reminders
        run: |
          curl --fail -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://personal-money-manager-be.onrender.com/api/internal/due-reminders
