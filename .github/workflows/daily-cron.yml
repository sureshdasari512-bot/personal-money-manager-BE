name: Daily Due Reminders — 8 AM IST

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC = 08:00 IST
  workflow_dispatch:         # manual trigger for testing

jobs:
  trigger-due-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render — POST /internal/due-reminders
        run: |
          curl --fail -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://personal-money-manager-be.onrender.com/internal/due-reminders
